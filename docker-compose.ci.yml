services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env.ci
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --method=GET http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file: .env.ci
    depends_on:
      api:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      pytest
      --cov=utils
      --cov=fixtures
      --cov-report=term-missing
      --cov-report=html
      --cov-fail-under=80
      --html=reports/pytest_report.html
      --self-contained-html
      -v
